name: Gerar imagens IA

# Gera as imagens de IA de um episódio (Gemini, ou Replicate / Flux) e publica no branch assets.
# Precisa do segredo GEMINI_API_KEY ou REPLICATE_API_TOKEN.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Pasta do episódio (ex.: ep02-valachi)"
        required: true
      only:
        description: "Opcional: só estes planos, separados por vírgula"
        required: false
        default: ""
      force:
        description: "Regerar planos que já têm imagem"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: assets
          path: assets
          # only this episode's folder: the whole assets branch no longer fits on the runner disk
          sparse-checkout: ${{ inputs.episode }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Gerar
        continue-on-error: true
        working-directory: main
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
        run: |
          args=(--out ../out --only "${{ inputs.only }}" --existing "../assets/${{ inputs.episode }}/ai")
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          mkdir -p "../out/${{ inputs.episode }}"
          set -o pipefail
          python3 agent/gen_images.py "${{ inputs.episode }}" "${args[@]}" 2>&1 | tee "../out/${{ inputs.episode }}/gen_log.txt"
      - name: Guardar cópia (backup)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: saida-${{ inputs.episode }}-${{ github.run_id }}
          path: out/${{ inputs.episode }}
          retention-days: 7
          if-no-files-found: ignore
      - name: Publicar
        if: ${{ !cancelled() }}
        run: |
          EP="${{ inputs.episode }}"
          bash main/agent/publish_assets.sh "out/$EP" "$EP" "Imagens IA: $EP"
