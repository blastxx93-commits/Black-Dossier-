name: Gerar imagens IA

# Gera as imagens de IA de um episódio (Replicate / Flux) e publica no branch assets.
# Precisa do segredo REPLICATE_API_TOKEN.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Pasta do episódio (ex.: ep02-valachi)"
        required: true
      only:
        description: "Opcional: só estes planos, separados por vírgula"
        required: false
        default: ""
      force:
        description: "Regerar planos que já têm imagem"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: assets-${{ inputs.episode }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: assets
          path: assets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Gerar
        continue-on-error: true
        working-directory: main
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          args=(--out ../out --only "${{ inputs.only }}" --existing "../assets/${{ inputs.episode }}/ai")
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          mkdir -p "../out/${{ inputs.episode }}"
          set -o pipefail
          python3 agent/gen_images.py "${{ inputs.episode }}" "${args[@]}" 2>&1 | tee "../out/${{ inputs.episode }}/gen_log.txt"
      - name: Publicar
        if: ${{ !cancelled() }}
        run: |
          EP="${{ inputs.episode }}"
          [ -d "out/$EP" ] || { echo "Nada para publicar"; exit 0; }
          mkdir -p "assets/$EP"
          cp -r out/$EP/. "assets/$EP/"
          cd assets
          git config user.name "black-dossier-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$EP"
          git commit -m "Imagens IA: $EP" || exit 0
          git pull --rebase origin assets && git push origin HEAD:assets
