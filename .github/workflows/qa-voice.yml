name: Conferir narração (transcrição precisa)

# Transcreve assets/<ep>/audio com um modelo maior (medium/large-v3) para revisar pronúncia e números.
# Grava em assets/<ep>/words_qa (não mexe nos tempos usados na montagem).
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Pasta do episódio"
        required: true
      model:
        description: "Modelo do Whisper"
        required: false
        default: "medium"

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: assets
          path: assets
          sparse-checkout: ${{ inputs.episode }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install faster-whisper==1.1.1 requests imageio-ffmpeg
      - name: Transcrever
        run: python3 main/agent/transcribe.py "assets/${{ inputs.episode }}/audio" "assets/${{ inputs.episode }}/words_qa" --lang pt --model "${{ inputs.model }}"
      - name: Publicar
        if: ${{ !cancelled() }}
        run: |
          cd assets
          git config user.name "black-dossier-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.episode }}/words_qa"
          git commit -m "Conferência da narração: ${{ inputs.episode }}" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase origin assets && git push -q origin HEAD:assets && break; sleep 5; done
