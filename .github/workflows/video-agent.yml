name: Agente de vídeos

# Busca filmes livres (Internet Archive + Wikimedia Commons; Pexels e Pixabay se os segredos PEXELS_API_KEY /
# PIXABAY_API_KEY existirem) e recorta clipes curtos.
# Resultado no branch assets: <ep>/video/<plano>/*.mp4 + video_contact_sheet_*.jpg + video_credits.csv
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Pasta do episódio (ex.: ep02-valachi)"
        required: true
      only:
        description: "Opcional: só estes planos, separados por vírgula"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: assets
          path: assets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install requests pillow imageio-ffmpeg
      - name: Buscar vídeos
        continue-on-error: true
        working-directory: main
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: |
          mkdir -p "../out/${{ inputs.episode }}"
          set -o pipefail
          python3 agent/search_videos.py "${{ inputs.episode }}" --out ../out --only "${{ inputs.only }}" --budget 42 2>&1 | tee "../out/${{ inputs.episode }}/video_run.txt"
      - name: Guardar cópia (backup)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: saida-${{ inputs.episode }}-${{ github.run_id }}
          path: out/${{ inputs.episode }}
          retention-days: 7
          if-no-files-found: ignore
      - name: Publicar
        if: ${{ !cancelled() }}
        run: |
          EP="${{ inputs.episode }}"
          bash main/agent/publish_assets.sh "out/$EP" "$EP" "Vídeos: $EP"
