name: Transcrever narração

# Lê os áudios em assets/<ep>/audio e grava os tempos de cada palavra em assets/<ep>/words.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Pasta do episódio (ex.: ep01-apalachin)"
        required: true
        default: "ep01-apalachin"
      model:
        description: "Opcional: modelo do Whisper (ex.: medium) — com ele grava em words_qa/ só para conferência"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: assets
          path: assets
          # only this episode's folder: the whole assets branch no longer fits on the runner disk
          sparse-checkout: ${{ inputs.episode }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install faster-whisper==1.1.1 requests imageio-ffmpeg
      - name: Transcrever
        continue-on-error: true
        run: |
          OUT=words; EXTRA=""
          if [ -n "${{ inputs.model }}" ]; then OUT=words_qa; EXTRA="--model ${{ inputs.model }}"; fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "assets/${{ inputs.episode }}/$OUT"
          ls -la "assets/${{ inputs.episode }}/audio" > "assets/${{ inputs.episode }}/$OUT/transcribe_log.txt" 2>&1
          set -o pipefail
          python3 main/agent/transcribe.py "assets/${{ inputs.episode }}/audio" "assets/${{ inputs.episode }}/$OUT" --lang "$(cat main/episodes/${{ inputs.episode }}/lang 2>/dev/null || echo en)" $EXTRA 2>&1 | tee -a "assets/${{ inputs.episode }}/$OUT/transcribe_log.txt"
      - name: Publicar
        if: ${{ !cancelled() }}
        run: |
          cd assets
          git config user.name "black-dossier-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.episode }}/$OUT"
          git commit -m "Tempos das palavras ($OUT): ${{ inputs.episode }}" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase origin assets && git push -q origin HEAD:assets && break; sleep 5; done
