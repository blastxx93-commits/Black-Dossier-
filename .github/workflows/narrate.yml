name: Gerar narração

# Gera a narração de cada capítulo (Fish Audio) a partir do roteiro e já transcreve
# palavra por palavra para a sincronia da edição. Publica tudo no branch assets.
# Provedor padrão: Fish Audio (FISH_API_KEY, FISH_VOICE_ID). Opcional: provider=eleven (segredo ELEVENLABS_API_KEY).
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Pasta do episódio (ex.: ep02-valachi)"
        required: true
      only:
        description: "Opcional: só estes capítulos (ex.: ch00_hook,ch03)"
        required: false
        default: ""
      speed:
        description: "Velocidade da voz (1.0 = normal)"
        required: false
        default: "1.0"
      voice:
        description: "Opcional: ID de outra voz Fish Audio (vazio = voz padrão do canal)"
        required: false
        default: ""
      model:
        description: "Opcional: modelo (Fish: s2.1-pro-free; ElevenLabs: eleven_v3...; vazio = padrão)"
        required: false
        default: ""
      provider:
        description: "Provedor de voz: fish (Fish Audio) ou eleven (ElevenLabs)"
        required: false
        default: "fish"
      from_run:
        description: "Recuperar: só publica a cópia de segurança de outra execução (número da execução), sem gerar voz"
        required: false
        default: ""
      voice_test:
        description: "Teste de vozes: idioma (ex.: pt). Narra só o ch00_hook com as vozes mais usadas da Fish nesse idioma (+ as de 'voice', separadas por vírgula; 'only' vira palavra de busca no nome da voz, ex.: narrador) e publica em vozes/<episódio>[-busca]/"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: assets
          path: assets
          # only this episode's folder: the whole assets branch no longer fits on the runner disk
          sparse-checkout: ${{ inputs.episode }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests imageio-ffmpeg faster-whisper==1.1.1 librosa
      - name: Testar vozes
        if: ${{ inputs.voice_test != '' }}
        working-directory: main
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_MODEL: ${{ inputs.model != '' && inputs.model || vars.FISH_MODEL }}
        run: |
          python3 agent/fish_voices.py --text "episodes/${{ inputs.episode }}/narration/ch00_hook.txt" --lang "${{ inputs.voice_test }}" \
            --n 6 --ids "${{ inputs.voice }}" --query "${{ inputs.only }}" --tag "${{ inputs.episode }}${{ inputs.only != '' && format('-{0}', inputs.only) || '' }}" --out ../out
          T="${{ inputs.episode }}${{ inputs.only != '' && format('-{0}', inputs.only) || '' }}"
          cd .. && bash main/agent/publish_assets.sh "out/vozes/$T" "vozes/$T" "Teste de vozes: ${{ inputs.episode }}"
      - name: Narrar
        if: ${{ inputs.from_run == '' && inputs.voice_test == '' }}
        working-directory: main
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ inputs.provider != 'eleven' && inputs.voice != '' && inputs.voice || secrets.FISH_VOICE_ID }}
          FISH_MODEL: ${{ inputs.provider != 'eleven' && inputs.model != '' && inputs.model || vars.FISH_MODEL }}
          TTS_PROVIDER: ${{ inputs.provider }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ inputs.provider == 'eleven' && inputs.voice || '' }}
          ELEVEN_MODEL: ${{ inputs.provider == 'eleven' && inputs.model || '' }}
        continue-on-error: true
        run: |
          mkdir -p "../out/${{ inputs.episode }}"
          set -o pipefail
          L="$(cat episodes/${{ inputs.episode }}/lang 2>/dev/null || echo en)"
          if [ "$L" != "en" ] && [ "${{ inputs.provider }}" != "eleven" ] && [ ! -f "episodes/${{ inputs.episode }}/tts_whole" ]; then
            # canal em português: narração estável, parágrafo a parágrafo, com conferência de bugs e de tom
            python3 agent/tts_stable.py "${{ inputs.episode }}" --out ../out --only "${{ inputs.only }}" --lang "$L" $(cat episodes/${{ inputs.episode }}/tts_args 2>/dev/null) 2>&1 | tee "../out/${{ inputs.episode }}/tts_log.txt"
          else
            python3 agent/tts.py "${{ inputs.episode }}" --out ../out --only "${{ inputs.only }}" --speed "${{ inputs.speed }}" 2>&1 | tee "../out/${{ inputs.episode }}/tts_log.txt"
          fi
      - name: Transcrever (tempo de cada palavra)
        if: ${{ inputs.from_run == '' && inputs.voice_test == '' && hashFiles(format('out/{0}/audio/*.mp3', inputs.episode)) != '' }}
        # idioma do episódio: arquivo episodes/<ep>/lang (ex.: "pt" no canal Antártica); sem ele, inglês
        run: python3 main/agent/transcribe.py "out/${{ inputs.episode }}/audio" "out/${{ inputs.episode }}/words" --lang "$(cat main/episodes/${{ inputs.episode }}/lang 2>/dev/null || echo en)"
      - name: Conferir falhas da voz e regravar (até 2 vezes)
        if: ${{ inputs.from_run == '' && inputs.voice_test == '' && hashFiles(format('out/{0}/audio/*.mp3', inputs.episode)) != '' }}
        working-directory: main
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ inputs.provider != 'eleven' && inputs.voice != '' && inputs.voice || secrets.FISH_VOICE_ID }}
          FISH_MODEL: ${{ inputs.provider != 'eleven' && inputs.model != '' && inputs.model || vars.FISH_MODEL }}
          TTS_PROVIDER: ${{ inputs.provider }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ inputs.provider == 'eleven' && inputs.voice || '' }}
          ELEVEN_MODEL: ${{ inputs.provider == 'eleven' && inputs.model || '' }}
        run: |
          EP="${{ inputs.episode }}"; L="$(cat episodes/$EP/lang 2>/dev/null || echo en)"
          # canal em português: regra do dono (08/11/2026) = sempre a 1ª geração da Fish, nada de regravar sozinho
          if [ "$L" != "en" ]; then python3 agent/check_narration.py "../out/$EP/words" > "../out/$EP/falhas_voz.txt" || true; exit 0; fi
          for k in 1 2; do
            BAD=$(python3 agent/check_narration.py "../out/$EP/words")
            [ -z "$BAD" ] && { echo "narração sem falhas"; break; }
            echo "regravando: $BAD (tentativa $k)"
            if [ "$L" != "en" ]; then
              python3 agent/tts_stable.py "$EP" --out ../out --only "$BAD" --lang "$L" 2>&1 | tee -a "../out/$EP/tts_log.txt"
            else
              python3 agent/tts.py "$EP" --out ../out --only "$BAD" --speed "${{ inputs.speed }}" 2>&1 | tee -a "../out/$EP/tts_log.txt"
            fi
            mkdir -p ../redo && rm -f ../redo/*.mp3
            for c in ${BAD//,/ }; do cp "../out/$EP/audio/$c.mp3" ../redo/; done
            python3 agent/transcribe.py ../redo "../out/$EP/words" --lang "$L"
          done
          python3 agent/check_narration.py "../out/$EP/words" > "../out/$EP/falhas_voz.txt" || true
      - name: Guardar cópia (backup)
        if: ${{ inputs.from_run == '' && !cancelled() && inputs.voice_test == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: saida-${{ inputs.episode }}-${{ github.run_id }}
          path: out/${{ inputs.episode }}
          retention-days: 7
          if-no-files-found: ignore
      - name: Recuperar cópia de outra execução
        if: ${{ inputs.from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: saida-${{ inputs.episode }}-${{ inputs.from_run }}
          path: out/${{ inputs.episode }}
          run-id: ${{ inputs.from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Igualar o tom entre parágrafos (canal em português)
        if: ${{ !cancelled() && inputs.voice_test == '' && hashFiles(format('out/{0}/words/*.json', inputs.episode)) != '' }}
        working-directory: main
        run: |
          EP="${{ inputs.episode }}"; L="$(cat episodes/$EP/lang 2>/dev/null || echo en)"
          if [ "$L" = "en" ]; then exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          [ -f "../out/$EP/tom_corrigido.md" ] && { echo "tom já corrigido"; exit 0; }
          # capítulo gerado inteiro (tts_whole): entonação contínua, sem mexer no tom (o ajuste de tom deixa a voz robótica)
          [ -f "episodes/$EP/tts_whole" ] && { echo "capítulo inteiro: sem ajuste de tom"; exit 0; }
          python3 agent/fix_tone.py "$EP" "../out/$EP" $(cat episodes/$EP/tone_args 2>/dev/null)
      - name: Publicar
        if: ${{ !cancelled() && inputs.voice_test == '' }}
        run: |
          EP="${{ inputs.episode }}"
          bash main/agent/publish_assets.sh "out/$EP" "$EP" "Narração + tempos das palavras: $EP"
