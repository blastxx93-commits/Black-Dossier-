name: Gerar narração

# Gera a narração de cada capítulo (Fish Audio) a partir do roteiro e já transcreve
# palavra por palavra para a sincronia da edição. Publica tudo no branch assets.
# Precisa dos segredos FISH_API_KEY e FISH_VOICE_ID.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Pasta do episódio (ex.: ep02-valachi)"
        required: true
      only:
        description: "Opcional: só estes capítulos (ex.: ch00_hook,ch03)"
        required: false
        default: ""
      speed:
        description: "Velocidade da voz (1.0 = normal)"
        required: false
        default: "1.0"

permissions:
  contents: write

concurrency:
  group: assets-${{ inputs.episode }}
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: assets
          path: assets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests imageio-ffmpeg faster-whisper==1.1.1
      - name: Narrar
        working-directory: main
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          FISH_MODEL: ${{ vars.FISH_MODEL }}
        continue-on-error: true
        run: |
          mkdir -p "../out/${{ inputs.episode }}"
          set -o pipefail
          python3 agent/tts.py "${{ inputs.episode }}" --out ../out --only "${{ inputs.only }}" --speed "${{ inputs.speed }}" 2>&1 | tee "../out/${{ inputs.episode }}/tts_log.txt"
      - name: Transcrever (tempo de cada palavra)
        if: ${{ hashFiles(format('out/{0}/audio/*.mp3', inputs.episode)) != '' }}
        run: python3 main/agent/transcribe.py "out/${{ inputs.episode }}/audio" "out/${{ inputs.episode }}/words"
      - name: Publicar
        if: ${{ !cancelled() }}
        run: |
          EP="${{ inputs.episode }}"
          [ -d "out/$EP" ] || { echo "Nada para publicar"; exit 0; }
          mkdir -p "assets/$EP"
          cp -r out/$EP/. "assets/$EP/"
          cd assets
          git config user.name "black-dossier-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$EP"
          git commit -m "Narração + tempos das palavras: $EP" || exit 0
          git pull --rebase origin assets && git push origin HEAD:assets
