name: Gerar narração

# Gera a narração de cada capítulo (Fish Audio) a partir do roteiro e já transcreve
# palavra por palavra para a sincronia da edição. Publica tudo no branch assets.
# Precisa dos segredos FISH_API_KEY e FISH_VOICE_ID.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Pasta do episódio (ex.: ep02-valachi)"
        required: true
      only:
        description: "Opcional: só estes capítulos (ex.: ch00_hook,ch03)"
        required: false
        default: ""
      speed:
        description: "Velocidade da voz (1.0 = normal)"
        required: false
        default: "1.0"
      voice:
        description: "Opcional: ID de outra voz da Fish (vazio = voz padrão do segredo FISH_VOICE_ID)"
        required: false
        default: ""
      lang:
        description: "Idioma da narração para a transcrição (en, fr, pt...)"
        required: false
        default: "en"

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests imageio-ffmpeg faster-whisper==1.1.1
      - name: Narrar
        working-directory: main
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ inputs.voice || secrets.FISH_VOICE_ID }}
          FISH_MODEL: ${{ vars.FISH_MODEL }}
        continue-on-error: true
        run: |
          mkdir -p "../out/${{ inputs.episode }}"
          set -o pipefail
          python3 agent/tts.py "${{ inputs.episode }}" --out ../out --only "${{ inputs.only }}" --speed "${{ inputs.speed }}" 2>&1 | tee "../out/${{ inputs.episode }}/tts_log.txt"
      - name: Transcrever (tempo de cada palavra)
        if: ${{ hashFiles(format('out/{0}/audio/*.mp3', inputs.episode)) != '' }}
        run: python3 main/agent/transcribe.py "out/${{ inputs.episode }}/audio" "out/${{ inputs.episode }}/words" --language "${{ inputs.lang || 'en' }}"
      - name: Guardar cópia (backup)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: saida-${{ inputs.episode }}-${{ github.run_id }}
          path: out/${{ inputs.episode }}
          retention-days: 7
          if-no-files-found: ignore
      - name: Publicar
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          EP="${{ inputs.episode }}"
          bash main/agent/publish_sparse.sh "out/$EP" "$EP" "Narração + tempos das palavras: $EP"
