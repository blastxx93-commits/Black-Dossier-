name: Agente de imagens

# Dispare pelo celular: Actions -> "Agente de imagens" -> Run workflow.
# Resultado vai para o branch "assets" (pasta do episódio) e aparece no resumo da execução.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Pasta do episódio (ex.: ep01-apalachin)"
        required: true
        default: "ep01-apalachin"
      only:
        description: "Opcional: só estes planos, separados por vírgula"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: image-agent-${{ inputs.episode }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r agent/requirements.txt

      - name: Buscar imagens
        timeout-minutes: 42
        continue-on-error: true
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python3 agent/search_images.py "${{ inputs.episode }}" --out assets_out --only "${{ inputs.only }}" --budget 35

      - name: Guardar cópia (backup)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fotos-${{ inputs.episode }}-${{ github.run_id }}
          path: assets_out/${{ inputs.episode }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar no branch assets
        if: ${{ !cancelled() }}
        env:
          EP: ${{ inputs.episode }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ ! -d "assets_out/$EP" ]; then echo "Nada para publicar"; exit 0; fi
          if [ -n "$ONLY" ]; then
            # partial run: keep the full-run sheets/report intact
            stamp=$(date -u +%m%d-%H%M)
            for f in assets_out/$EP/contact_sheet_*.jpg; do [ -f "$f" ] && mv "$f" "assets_out/$EP/parcial_${stamp}_$(basename "$f")"; done
            [ -f "assets_out/$EP/report.md" ] && mv "assets_out/$EP/report.md" "assets_out/$EP/report_parcial.md"
            [ -f "assets_out/$EP/credits.csv" ] && mv "assets_out/$EP/credits.csv" "assets_out/$EP/credits_parcial_${stamp}.csv"
          fi
          # never deletes what other agents published (narration, AI images, videos)
          mkdir -p ../ws && cp -r . ../ws/main && cd ../ws
          bash main/agent/publish_assets.sh "main/assets_out/$EP" "$EP" "Imagens: $EP ${ONLY:+(planos: $ONLY)}"
